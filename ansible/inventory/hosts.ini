[local]
localhost ansible_connection=local

[staging]
staging-server ansible_host=staging.noteforge.internal ansible_user=deployer target_env=staging app_port=5001

[production]
prod-server-01 ansible_host=prod1.noteforge.internal ansible_user=deployer target_env=production app_port=5000
prod-server-02 ansible_host=prod2.noteforge.internal ansible_user=deployer target_env=production app_port=5000

[all:vars]
app_root=/opt/noteforge
state_dir=/opt/noteforge/state
compose_file_base=docker-compose.yml
