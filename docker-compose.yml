version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_TAG:-noteforge:local}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5001}:5000"
    environment:
      - FLASK_ENV=${FLASK_ENV:-development}
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_NAME=${POSTGRES_DB:-noteforge}
      - DATABASE_USER=${POSTGRES_USER:-noteforge_user}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:-noteforge_dev_pwd}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-noteforge_user}:${POSTGRES_PASSWORD:-noteforge_dev_pwd}@db:5432/${POSTGRES_DB:-noteforge}
      - SECRET_KEY=${SECRET_KEY:-noteforge-insecure-dev-key}
      - APP_VERSION=${APP_VERSION:-1.0.0-dev}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:5000/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - noteforge-network

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-noteforge_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-noteforge_dev_pwd}
      - POSTGRES_DB=${POSTGRES_DB:-noteforge}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-noteforge_user} -d ${POSTGRES_DB:-noteforge}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - noteforge-network

volumes:
  postgres_data:
    name: noteforge_pgdata

networks:
  noteforge-network:
    name: noteforge-net
    driver: bridge
